# Render Blueprint: the API (free web service) and the web app (free static site).
# The database is Supabase's free Postgres; see docs/hosting.md for the full setup.
#
# If Render cannot give a service the name below (names are global), it adds a suffix to the
# URL. Then update EXPO_PUBLIC_API_URL (web app), CORS_ORIGINS (API) and the API_URL repository
# variable read by .github/workflows/keep-alive.yml to the real addresses.
services:
  - type: web
    name: anbu-ai-api
    runtime: node
    plan: free
    region: singapore # nearest Render region to India; create the Supabase project there too
    buildCommand: >-
      npm ci -w @anbu/api -w @anbu/shared &&
      npm run db:generate -w @anbu/api &&
      npm run db:deploy -w @anbu/api
    startCommand: npm run start -w @anbu/api
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/api/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Supabase "Session pooler" connection string, ending in ?sslmode=require (see docs/hosting.md).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # From https://aistudio.google.com/apikey; leave empty to run without the assistant.
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://anbu-ai-app.onrender.com,http://localhost:8081
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: REGISTRATION_OPEN
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'

  - type: web
    name: anbu-ai-app
    runtime: static
    buildCommand: npm ci -w @anbu/mobile -w @anbu/shared && npm run export:web -w @anbu/mobile
    staticPublishPath: apps/mobile/dist
    buildFilter:
      paths:
        - apps/mobile/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    routes:
      # Every app screen is served by index.html (files that exist are served as they are).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: EXPO_PUBLIC_API_URL
        value: https://anbu-ai-api.onrender.com
