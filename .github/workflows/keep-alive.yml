# Render's free web services sleep after 15 minutes without requests, and a sleeping API cannot
# send reminders. Pinging /health every 10 minutes keeps it awake (one service running all month
# fits in Render's 750 free hours) and keeps the Supabase project active.
# GitHub runs schedules on a best-effort basis and pauses them after 60 days without commits;
# re-enable from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://anbu-ai-api.onrender.com/health
